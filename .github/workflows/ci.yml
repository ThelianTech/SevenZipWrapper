name: Release verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore SevenZipWrapper.slnx --locked-mode
      - name: Clean Release outputs
        run: dotnet clean SevenZipWrapper.slnx -c Release
      - name: Build Release with warning gate
        run: dotnet build SevenZipWrapper.slnx --no-restore -c Release -p:ContinuousIntegrationBuild=true
      - name: Test with coverage
        run: dotnet test src/SevenZipWrapper.Tests/SevenZipWrapper.Tests.csproj --no-build --no-restore -c Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - name: Pack
        run: dotnet pack src/SevenZipWrapper/SevenZipWrapper.csproj --no-build --no-restore -c Release -o artifacts/packages
      - name: Inspect package and run isolated consumer build and publish
        run: ./scripts/Verify-Package.ps1
      - name: Retain tests, coverage, package, and verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-release-verification
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/packages/*.nupkg
            artifacts/package-verification/**/verification.json
            artifacts/package-verification/**/consumer/Consumer.csproj
            artifacts/package-verification/**/consumer/packages.lock.json
